name: CI

# One npm workspace install at the repo root (package-lock.json covers backend
# and frontend). --ignore-scripts skips msnodesqlv8's native build: it is the
# Windows-only NTLM driver and is loaded lazily, so Linux CI never needs it.

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint (errors fail, warnings reported)
        run: npx eslint "backend/src/**/*.ts"
      - name: Test
        working-directory: backend
        run: npx jest --ci
      - name: Build
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend — lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint (errors fail, warnings reported)
        run: npx eslint "frontend/src/**/*.{ts,tsx}"
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit -p .
      - name: Test
        working-directory: frontend
        run: npx vitest run
      - name: Build
        working-directory: frontend
        run: npx vite build
        env:
          VITE_API_URL: http://localhost:3000/api
