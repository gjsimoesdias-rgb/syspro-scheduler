server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API and health requests to the backend container.
    # In Docker Compose the backend is reachable at scheduler-backend:3000.
    # BACKEND_URL is substituted by envsubst at container start (see CMD below).
    location /api/ {
        proxy_pass http://scheduler-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Keep SSE connections alive
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://scheduler-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Serve static assets with long-lived cache headers.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — any path that doesn't match a file gets index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
